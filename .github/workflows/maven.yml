name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Scarica il codice dal repository
    - uses: actions/checkout@v4

    # 2. Installa Java
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # 3. Esegue i test con Maven
    # L'opzione -B (batch mode) riduce l'output inutile nei log
    - name: Build with Maven and Run Tests
      run: mvn -B test --file StockTrack/pom.xml